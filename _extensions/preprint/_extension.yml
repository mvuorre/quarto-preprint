title: Preprint
authors:
  - name: Matti Vuorre
    orcid: 0000-0001-5052-066X
version: 1.6.5
quarto-required: ">=1.9.36"
contributes:
  formats:
    typst:
      hide-abstract-title: true
      # No callout icons by default; `icon=true` on a callout turns one back on
      callout-icon: false
      # Note callouts are labelled "Box" (see typst-callouts.typ)
      language:
        callout-note-title: Box
        crossref-nte-prefix: Box
        crossref-note-prefix: Box
      functions: [place]
      include-before-body:
        # Render note callouts as grayscale "Boxes". 
        - typst-callouts.typ
      template-partials:
        # Appendix-aware numbering (see numbering.typ)
        - numbering.typ
        - typst-template.typ
        - typst-show.typ
      filters:
        - _extensions/christopherkenny/typst-function/typst-function.lua
